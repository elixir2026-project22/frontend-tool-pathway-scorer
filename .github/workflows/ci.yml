name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    # Linux only for now: Graphviz (pygraphviz) and Node (cytoscape.js) are system requirements
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install -y python3 && sudo ln -fs /usr/bin/python3 /usr/bin/python

